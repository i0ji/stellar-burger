  - ws@8.20.1
  - uuid@13.0.1
  - tmp@0.2.6 || 0.2.7
  - cypress-vite@1.10.1
  - form-data@4.0.6
  - js-yaml@3.15.0
overrides:
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  js-yaml@<3.15.0: ^3.15.0
